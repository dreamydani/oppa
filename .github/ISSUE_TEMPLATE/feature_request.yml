name: Feature request
description: Suggest an improvement for Oppa
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The workflow or limitation this addresses
      placeholder: Closing the window loses my long-running job context
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, described from the user's perspective
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you evaluated
    validations:
      required: false
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: false
