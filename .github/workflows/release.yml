# Release matrix: builds all three OSes, then one finalize job merges the
# per-platform updater feed (`latest.json` / `latest-rc.json`) and creates
# the GitHub release.
#
# Secrets required (repo Settings → Secrets → Actions):
# - TAURI_SIGNING_PRIVATE_KEY: minisign private key for updater artifacts.
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: optional, only if the key has one.
# - GITHUB_TOKEN: provided automatically by Actions (needs contents:write).
#
# Workflow cannot be executed locally — review is by reading + YAML discipline.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z)"
        required: true
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - rc

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: darwin-aarch64
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # WHY: the action refuses to run without an explicit version and the
          # repo has no packageManager field; pin the version proven locally.
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # WHY: Tauri links GTK/WebKit system libs on Linux; runners ship none.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      # WHY: the channel is baked in at compile time (Channel::current reads
      # OPPA_CHANNEL via option_env!), so the env must be set for the build.
      - name: Build bundles
        run: pnpm tauri build
        env:
          OPPA_CHANNEL: ${{ inputs.channel }}
          # WHY: the frontend bundle embeds monaco's multi-MB workers; vite
          # exceeds the default Node heap on CI runners (macOS OOMs first).
          NODE_OPTIONS: --max-old-space-size=8192
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: src-tauri/target/release/bundle/

  finalize:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: dist-bundles
      # WHY: the feed is composed from release.mjs pure fns (mergeLatestJson,
      # buildGhReleaseArgsMulti) — no second script to drift out of sync.
      - name: Compose feed and release args
        run: |
          node --input-type=module -e "
          import { copyFileSync, mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          import { mergeLatestJson, buildGhReleaseArgsMulti, manifestFilenames, targetTripleFromDir, selectUpdaterBundle, writeManifest } from './scripts/release.mjs';
          const version = process.env.VERSION, channel = process.env.CHANNEL;
          const { latest, manifest } = manifestFilenames(channel);
          mkdirSync('release-assets', { recursive: true });
          const entries = [], assets = [];
          for (const dir of readdirSync('dist-bundles', { withFileTypes: true })) {
            if (!dir.isDirectory()) continue;
            const walk = (d) => readdirSync(d, { withFileTypes: true }).flatMap((e) => {
              const p = join(d, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            for (const file of walk(join('dist-bundles', dir.name))) {
              if (!file.endsWith('.sig')) continue;
              const asset = file.slice(0, -'.sig'.length);
              const sig = readFileSync(file, 'utf8').trim();
              const name = basename(asset);
              const url = 'https://github.com/dreamydani/oppa/releases/download/v' + version + '/' + encodeURIComponent(name);
              entries.push({ dir: dir.name, file, asset, sig, url });
            }
          }
          // WHY one bundle per triple: an OS dir holds several signed files but
          // the feed takes exactly one — group by matrix dir, pick explicitly.
          const byTriple = new Map();
          for (const e of entries) {
            const target = targetTripleFromDir(e.dir);
            if (!byTriple.has(target)) byTriple.set(target, []);
            byTriple.get(target).push(e);
          }
          const picked = [];
          for (const [target, group] of byTriple) {
            const names = group.map((e) => basename(e.asset));
            const winner = selectUpdaterBundle(names, target);
            picked.push({ target, ...group.find((e) => basename(e.asset) === winner) });
          }
          for (const e of picked) {
            const name = basename(e.asset);
            copyFileSync(e.asset, join('release-assets', name));
            copyFileSync(e.file, join('release-assets', name + '.sig'));
            assets.push(join('release-assets', name), join('release-assets', name + '.sig'));
          }
          const feedEntries = picked.map((e) => {
            const triple = targetTripleFromDir(e.dir);
            return { target: triple, url: e.url, signature: e.sig };
          });
          const feed = mergeLatestJson({ version, pubDate: new Date().toISOString(), entries: feedEntries });
          writeFileSync(join('release-assets', latest), JSON.stringify(feed, null, 2) + '\n');
          assets.push(join('release-assets', latest));
          // WHY: pre-native binaries (0.2.2/0.2.3) read only the legacy
          // custom shape — without this file their card never appears and
          // the one-hop migration to the native flow cannot start.
          const win = picked.find((e) => targetTripleFromDir(e.dir) === 'windows-x86_64') ?? picked[0];
          const { manifestPath } = writeManifest(version, basename(win.asset), win.sig, manifest);
          copyFileSync(manifestPath, join('release-assets', manifest));
          assets.push(join('release-assets', manifest));
          writeFileSync('gh-args.json', JSON.stringify(buildGhReleaseArgsMulti(version, assets, channel === 'rc')));
          "
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
      - name: Create GitHub release
        run: |
          mapfile -d '' ARGS < <(jq -j '.[] | . + "\u0000"' gh-args.json)
          gh "${ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # WHY: `latest/download` only serves the stable Latest release, so the
      # rc feed lives on a pinned moving `rc` tag the rc pipeline refreshes.
      - name: Refresh rc feed tag
        if: ${{ inputs.channel == 'rc' }}
        run: |
          gh release view rc --repo dreamydani/oppa >/dev/null 2>&1 || \
            gh release create rc --repo dreamydani/oppa --title "oppa rc feed" \
              --notes "Moving RC feed. Install a versioned prerelease, never this tag." --prerelease
          gh release upload rc "release-assets/latest-rc.json" --clobber --repo dreamydani/oppa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
